name: CI checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Build with strict warning flags.  Catches the kinds of regressions
  # that the distro-packaged build workflow does not.
  #
  # Run on a matrix of Ubuntu LTS versions to catch the case where
  # a PR compiles cleanly on 24.04 but breaks on 22.04 (e.g. due
  # to a deprecated glib API still present in 22.04's libraries,
  # or a missing -Wno-foo flag in the 24.04 default compiler).
  warnings:
    name: Strict warnings (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04]
    container:
      image: ubuntu:${{ matrix.distro == 'ubuntu-22.04' && '22.04' || '24.04' }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            xapp-symbolic-icons \
            shared-mime-info \
            gettext \
            intltool \
            libxreaderdocument-dev \
            libxreaderview-dev \
            desktop-file-utils \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (strict warnings)
        run: |
          meson setup build \
            --buildtype=debug \
            --werror \
            --warnlevel=2 \
            -Dc_args="-Wall -Wextra -Wformat=2 -Wformat-security -Wnull-dereference -Wmissing-prototypes -Wmissing-declarations -Wshadow -Wpointer-arith -Wcast-align -Wstrict-prototypes -Wno-unused-parameter"
      - name: Build
        run: ninja -C build
      - name: Test
        run: xvfb-run -a meson test -C build --print-errorlogs

  # Build with AddressSanitizer + UndefinedBehaviorSanitizer.  Catches
  # the kinds of memory safety / UB bugs that the libepub null-pointer
  # fix (commit a79398c) and the sizeof-of-array fix (commit 1cde192)
  # were found by, manually.  This automates the check.
  sanitizers:
    name: ASan + UBSan (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04]
    container:
      image: ubuntu:${{ matrix.distro == 'ubuntu-22.04' && '22.04' || '24.04' }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            xapp-symbolic-icons \
            shared-mime-info \
            gettext \
            intltool \
            libxreaderdocument-dev \
            libxreaderview-dev \
            desktop-file-utils \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (sanitizers)
        run: |
          CC=clang CXX=clang++ meson setup build-san \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Db_lto=false \
            -Dcpp_args="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -Dc_args="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
      - name: Build
        run: ninja -C build-san
      - name: Test
        run: xvfb-run -a meson test -C build-san --print-errorlogs
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:print_stacktrace=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

  # Run the libFuzzer harness for 60 seconds per CI invocation.
  # Requires PR #13 (feat/fuzz-harness) to be merged first, since
  # the harness lives in fuzz/fuzz-document-load.c.  Once the
  # fuzz harness is on master, this job gives every PR a free
  # quick-fuzz round and catches crashes in the document-parsing
  # path that the unit tests cannot reach.
  fuzz:
    name: 60s libFuzzer smoke
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            meson \
            pkg-config \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libsm-dev \
            libice-dev \
            libx11-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            xapp-symbolic-icons \
            shared-mime-info \
            gettext \
            intltool \
            libxreaderdocument-dev \
            libxreaderview-dev \
            desktop-file-utils \
            xvfb \
            ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (fuzz)
        run: |
          CC=clang CXX=clang++ meson setup build-fuzz \
            --buildtype=debug \
            -Dfuzz=true \
            -Db_sanitize=address,undefined,fuzzer \
            -Dcpp_args="-fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer" \
            -Dc_args="-fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer -O1 -g"
      - name: Build
        run: ninja -C build-fuzz fuzz-document-load
      - name: Seed corpus
        run: |
          mkdir -p fuzz-corpus
          # No upstream tests directory; an empty corpus is fine for
          # coverage-driven libFuzzer.  Real corpora (e.g. the
          # xreader-1.0 corpus) can be downloaded as a follow-up
          # and dropped into fuzz-corpus/ to seed the run.
          find test/ -maxdepth 2 -type f \
              \( -name '*.pdf' -o -name '*.djvu' -o -name '*.dvi' -o -name '*.epub' -o -name '*.tiff' -o -name '*.tif' -o -name '*.xps' -o -name '*.oxps' -o -name '*.cbz' -o -name '*.cbr' \) \
              -exec cp {} fuzz-corpus/ \; 2>/dev/null || true
          echo "Corpus size: $(ls -1 fuzz-corpus/ 2>/dev/null | wc -l) file(s)"
      - name: Run fuzzer
        run: |
          cd build-fuzz
          mkdir -p ../fuzz-crashes
          # 60-second time-boxed run.  libFuzzer exits 0 on a clean
          # run, non-zero on the first crash (the offending input
          # is left in ./crash-* in the current dir for upload).
          timeout 60s ./fuzz-document-load ../fuzz-corpus/ \
            -max_len=1048576 \
            -max_total_time=60 \
            -rss_limit_mb=2048 \
            -artifact_prefix=../fuzz-crashes/ \
          || rc=$?
          rc=${rc:-0}
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::fuzz-document-load exited with code $rc"
            echo "Crashing inputs are in fuzz-crashes/ as artifacts"
            exit "$rc"
          fi
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
          if-no-files-found: ignore
  # Lint the commit messages of all commits on the PR branch
  # (push events only get the last 10 commits checked, to keep
  # the run time bounded).
  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        run: |
          set -e
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: lint every commit the PR added on top of master.
            range="origin/master..HEAD"
          else
            # push: lint the last 10 commits (the rest would be
            # covered by their own PRs at the time they landed).
            range="HEAD~10..HEAD"
          fi
          echo "Linting range: $range"
          ./tools/lint-commits.sh "$range"
  # Static analysis with cppcheck.  Catches the kinds of
  # memory-safety, NULL-deref, and uninitialized-variable bugs
  # that the sanitizer job (PR #8) only catches at runtime, and
  # that the warnings job (PR #8) sometimes lets through because
  # -Wall does not flag every CWE.  cppcheck is intentionally
  # run with --enable=warning,style,performance,portability,info
  # (NOT --enable=all, which generates hundreds of false
  # positives in legacy C code).
  cppcheck:
    name: cppcheck static analysis
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cppcheck \
            build-essential \
            libgtk-3-dev \
            libpoppler-glib-dev \
            libgxps-dev \
            libspectre-dev \
            libkpathsea-dev \
            libdjvulibre-dev \
            libtiff-dev \
            libsecret-1-dev \
            libxapp-dev \
            libxml2-dev \
            libarchive-dev \
            libgirepository1.0-dev \
            libwebkit2gtk-4.1-dev \
            libzip-dev \
            intltool \
            pkg-config
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run cppcheck
        run: |
          # The libdocument + shell + libview code is the
          # security-critical attack surface (the document
          # parsers live there), so scan those subdirs first
          # and fail the job on the first error.
          set -e
          cppcheck --quiet --error-exitcode=1 \
            --enable=warning,style,performance,portability,info \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I libdocument -I libview -I shell -I backend -I cut-n-paste -I thumbnailer -I previewer \
            libdocument libview shell backend cut-n-paste thumbnailer previewer
